[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-recsys-oop"
version = "0.2.0"
description = "Contracts v1 model adapters and preserved multilingual BPR training engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
data = ["pandas>=2,<3", "pyarrow>=14", "scipy>=1.11"]
test = ["pytest>=8,<10"]
train = ["torch>=2.2", "pyarrow>=14"]
text = ["torch>=2.2", "transformers>=4.51,<5", "sentence-transformers>=3,<6", "huggingface-hub>=0.30,<1"]
benchmark = ["cornac>=2.2"]
ui = ["streamlit>=1.40,<2"]

[project.scripts]
game-recsys = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
